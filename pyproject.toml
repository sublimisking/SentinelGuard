[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelguard"
dynamic = ["version"]
description = "A Windows laptop anti-theft security application"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "psutil>=7.0",
    "pycaw",
    "comtypes",
    "pywin32; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.dynamic]
version = { attr = "sentinelguard.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
